name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DORF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:functions
      - run: npm run test -w @dorf/engine
      - run: npm run test -w @dorf/server
      - run: npm run test -w @dorf/mobile
      - run: npm run test -w @dorf/db-tests
      - name: Secrets-Scan (einfach)
        run: "! git grep -nE '(service_role|SUPABASE_SERVICE_ROLE_KEY)\\s*[:=]\\s*[\"'\\''][A-Za-z0-9._-]{20,}' -- . ':!docs' ':!*.md'"
